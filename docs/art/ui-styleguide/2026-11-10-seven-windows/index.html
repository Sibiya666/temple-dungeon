<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dialoid — семь окон</title><style>body{margin:0;background:#0c1114;color:#dedccf;font:16px Segoe UI,sans-serif}header{padding:15px 24px;border-bottom:1px solid #354a54}h1{font:24px Georgia;margin:0 0 8px}p{color:#a7b9bd;font-size:13px;margin:6px 0}nav{display:flex;flex-wrap:wrap;gap:7px;padding:12px 24px}button,a{font:inherit;color:inherit;border:1px solid #354a54;background:#111d23;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{border-color:#b7cdd4}button:focus-visible,a:focus-visible{outline:2px solid ivory;outline-offset:3px}main{padding:0 16px 20px}img{display:block;width:100%;height:auto}body.native img{width:1600px;max-width:none}a{font-size:13px;text-decoration:none}.tools{padding:4px 24px 14px;display:flex;gap:12px}</style><header><h1>DIALOID / Семь окон в стиле Башни</h1><p>Статические макеты с демонстрационными данными. Не игровой runtime. Переключение: ← / →.</p></header><nav id="nav"></nav><div class="tools"><button id="zoom">Масштаб 1:1</button><a href="overview.png?v=asc-tree2">Общий лист</a><a href="meter-confirm.png?v=asc-tree2">Подтверждение сброса</a></div><main><img id="preview" alt=""></main><script>const ids=['ascendancy','builds','breakdown','simulation','log','meter','charts'];const names=['Асцендант','Билды','Разбор','Симуляция','Журнал','Измеритель','Графики'];let current=0;const nav=document.querySelector('#nav');ids.forEach((id,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'. '+names[i];b.onclick=()=>show(i);nav.append(b)});function show(i){current=(i+7)%7;const im=document.querySelector('#preview');im.src=ids[current]+'.png?v=asc-tree2';im.alt=names[current]+' — статический макет';[...nav.children].forEach((b,j)=>b.setAttribute('aria-pressed',String(j===current)));location.hash=ids[current]}document.querySelector('#zoom').onclick=()=>{document.body.classList.toggle('native');document.querySelector('#zoom').textContent=document.body.classList.contains('native')?'Вписать в экран':'Масштаб 1:1'};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}});show(Math.max(0,ids.indexOf(location.hash.slice(1))));</script></html>
