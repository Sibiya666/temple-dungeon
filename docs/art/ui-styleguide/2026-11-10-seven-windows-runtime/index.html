<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dialoid — семь окон в игре</title><style>body{margin:0;background:#0c1114;color:#d8d5c6;font:16px 'Segoe UI',sans-serif}header,nav{padding:12px 20px;border-bottom:1px solid #334147}h1{font:25px Georgia;margin:0 0 8px}button,select{background:#10191d;color:#d8d5c6;border:1px solid #334147;padding:9px;margin:3px}button[aria-pressed=true]{border-color:#b7cbd0}button:focus-visible,select:focus-visible{outline:2px solid ivory}img{display:block;width:100%;height:auto}main{padding:12px}p{margin:6px 0;color:#9baeb3}</style><header><h1>DIALOID / Семь окон — игровой рендер</h1><p>Настоящие GPU-кадры Godot. Элементы на кадрах не интерактивны.</p></header><nav id="windows"></nav><nav><label>Размер <select id="size"><option>900</option><option>720</option></select></label><label>Состояние <select id="state"><option value="">Развёрнуто</option><option value="-side">Боковое (720p)</option><option value="-side-bottom">Низ прокрутки (720p)</option><option value="-ascendancy-focus">Фокус дерева</option><option value="-ascendancy-start-disabled">Стартовый узел</option><option value="-simulation-stale">Устаревшая симуляция</option><option value="-breakdown-stale">Устаревший снимок</option><option value="-meter-confirm">Подтверждение сброса</option><option value="-world-hud">Мир и HUD</option></select></label><p id="caption"></p></nav><main><img id="frame" alt="Игровой кадр"></main><script>const ids=['ascendancy','builds','breakdown','simulation','log','meter','charts'],names=['Асцендант','Билды','Разбор','Симуляция','Журнал','Измеритель','Графики'];let current=0;const nav=document.querySelector('#windows'),size=document.querySelector('#size'),state=document.querySelector('#state'),frame=document.querySelector('#frame');ids.forEach((id,i)=>{let b=document.createElement('button');b.textContent=names[i];b.onclick=()=>{current=i;state.value='';show()};nav.append(b)});function show(){let st=state.value,s=size.value,id=ids[current],suffix=st;if(st==='-side'||st==='-side-bottom'){s='720';size.value=s}else if(st){id=st.slice(1);suffix=''}frame.src='root-after/seven-'+s+'-'+id+suffix+'.png?v=runtime-final1';frame.alt=names[current]+' — игровой кадр '+s+'p';document.querySelector('#caption').textContent=(s==='900'?'1600 × 900':'1280 × 720')+' / '+(state.selectedOptions[0].textContent);[...nav.children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===current)))}size.onchange=state.onchange=show;show();</script></html>
