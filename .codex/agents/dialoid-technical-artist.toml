Холодный рассеянный свет с понятным источником, редкое локальное тепло, спокойные материалы; без общей каменной фактуры, золотых рамок и постоянного bloom. Персонажи принадлежат свету сцены. Итог проверяй под игровой камерой с настоящим UI.
